<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CEVICHERIA 21 - Reportes</title>
    <link rel="stylesheet" href="style.css?v=27.0">
    <link rel="icon" href="logo_v2.png">
</head>

<body class="glass">
    <script>
        if (localStorage.getItem('auth_master') !== 'true') {
            window.location.replace('index.html');
        }
    </script>
    <script>
        // MASTER KEY SECURITY CHECK
        if (localStorage.getItem('auth_master') !== 'true') {
            window.location.replace('index.html');
        }
    </script>
    <header>
        <div style="display: flex; align-items: center; gap: 15px;">
            <img src="logo_v2.png" style="height: 50px; border-radius: 12px; border: 1px solid var(--gold);">
            <div>
                <h1>📊 <span>BALANCE Y REPORTES</span></h1>
                <p style="margin: 0; color: var(--text-muted); font-size: 11px; letter-spacing: 1px;">ANÁLISIS DE
                    NEGOCIO</p>
            </div>
        </div>
        <a href="index.html" class="btn-exit"
            style="background: rgba(239, 68, 68, 0.1); color: var(--accent); padding: 10px 20px; border-radius: 12px; text-decoration: none; font-weight: 800; border: 1px solid rgba(239, 68, 68, 0.2); font-size: 12px;">CERRAR
            SESIÓN</a>
    </header>

    <div class="reports-main-layout"
        style="display: grid; grid-template-columns: 350px 1fr; gap: 20px; padding: 20px; min-height: calc(100vh - 80px);">
        <!-- LEFT: Calendar sidebar -->
        <div class="reports-sidebar glass" style="padding: 20px; display: flex; flex-direction: column; gap: 20px;">
            <div id="calendar-container">
                <h3 style="color: var(--gold); font-size: 14px; margin-top: 0; text-align: center;">📅 CALENDARIO</h3>
                <div id="custom-calendar-header"
                    style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                    <button onclick="changeMonth(-1)"
                        style="background:none; border:none; color:var(--gold); cursor:pointer; font-weight:800;">&lt;</button>
                    <span id="currentMonthYear" style="font-weight: 800; font-size: 13px; color: white;"></span>
                    <button onclick="changeMonth(1)"
                        style="background:none; border:none; color:var(--gold); cursor:pointer; font-weight:800;">&gt;</button>
                </div>
                <div id="calendar-grid"
                    style="display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; text-align: center;">
                    <!-- Days header -->
                    <div style="font-size: 10px; color: var(--text-muted); font-weight: 800;">D</div>
                    <div style="font-size: 10px; color: var(--text-muted); font-weight: 800;">L</div>
                    <div style="font-size: 10px; color: var(--text-muted); font-weight: 800;">M</div>
                    <div style="font-size: 10px; color: var(--text-muted); font-weight: 800;">M</div>
                    <div style="font-size: 10px; color: var(--text-muted); font-weight: 800;">J</div>
                    <div style="font-size: 10px; color: var(--text-muted); font-weight: 800;">V</div>
                    <div style="font-size: 10px; color: var(--text-muted); font-weight: 800;">S</div>
                    <!-- Days will be injected here -->
                </div>
                <div id="calendar-days"
                    style="display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; margin-top: 5px;"></div>
            </div>

            <div style="border-top: 1px solid var(--card-border); padding-top: 20px;">
                <h3 style="color: var(--gold); font-size: 13px; margin-top: 0;">REPORTE SELECCIONADO</h3>
                <div id="selectedInfo"
                    style="background: rgba(255,255,255,0.05); padding: 15px; border-radius: 12px; border: 1px solid var(--card-border);">
                    <div id="reportLabel" style="font-size: 11px; color: var(--text-muted); margin-bottom: 5px;">DIA
                        CARGADO</div>
                    <div id="reportValue" style="font-size: 16px; font-weight: 800; color: white;">-</div>
                </div>
            </div>

            <div class="stat-card" style="width: 100%; border-color: rgba(16, 185, 129, 0.3);">
                <span style="font-size: 10px; color: var(--text-muted);">INGRESOS</span>
                <div class="value" id="totalRevenue" style="font-size: 28px; color: var(--success); font-weight: 900;">
                    S/ 0.00</div>
            </div>

            <button class="btn-primary" onclick="window.print()" style="width: 100%; margin-top: auto;">
                🖨️ IMPRIMIR VISTA
            </button>
        </div>

        <!-- RIGHT: Detailed Content -->
        <div class="reports-content" style="display: flex; flex-direction: column; gap: 20px;">
            <!-- TOP FILTERS -->
            <div class="glass"
                style="padding: 15px 25px; border-radius: 20px; display: flex; justify-content: space-between; align-items: center;">
                <div style="display: flex; gap: 15px;">
                    <button id="viewDaily" class="btn-secondary active" onclick="switchView('daily')"
                        style="font-size: 12px; font-weight: 800; padding: 10px 20px;">DETALLE DIARIO</button>
                    <button id="viewWeekly" class="btn-secondary" onclick="switchView('weekly')"
                        style="font-size: 12px; font-weight: 800; padding: 10px 20px;">RESUMEN SEMANAL</button>
                </div>
                <div id="weekSelector" style="display: none; align-items: center; gap: 10px;">
                    <span style="font-size: 12px; color: var(--text-muted); font-weight: 600;">SEMANA:</span>
                    <input type="week" id="weekInput" onchange="runWeeklyReport()" class="glass-input"
                        style="padding: 5px 15px; font-size: 13px;">
                </div>
            </div>

            <!-- DATA AREA -->
            <div id="reportArea" class="glass" style="flex: 1; border-radius: 24px; padding: 30px;">
                <!-- Content will be injected here -->
            </div>
        </div>
    </div>

    <script type="module">
        import './script.js?v=v29';
        window.onload = () => {
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('reportDate').value = today;
            setTimeout(() => { if (typeof runReport === 'function') runReport(); }, 1500);
        };
    </script>
    <script>
        let currentView = 'daily';
        let selectedDate = new Date();
        let calendarDate = new Date();
        let history = [];

        window.onload = () => {
            // Wait for DB to load from script.js
            setTimeout(() => {
                const db = window.getDB();
                if (db && db.dailySales) {
                    history = db.dailySales;
                    console.log("History loaded:", history.length);
                }
                initCalendar();
                runDailyReport();
            }, 1000);
        };

        function switchView(view) {
            currentView = view;
            document.getElementById('viewDaily').classList.toggle('active', view === 'daily');
            document.getElementById('viewWeekly').classList.toggle('active', view === 'weekly');
            document.getElementById('weekSelector').style.display = view === 'weekly' ? 'flex' : 'none';

            if (view === 'daily') runDailyReport();
            else runWeeklyReport();
        }

        // --- CALENDAR LOGIC ---
        function initCalendar() {
            const container = document.getElementById('calendar-days');
            const tit = document.getElementById('currentMonthYear');
            container.innerHTML = '';

            const monthNames = ["ENERO", "FEBRERO", "MARZO", "ABRIL", "MAYO", "JUNIO", "JULIO", "AGOSTO", "SEPTIEMBRE", "OCTUBRE", "NOVIEMBRE", "DICIEMBRE"];
            tit.innerText = `${monthNames[calendarDate.getMonth()]} ${calendarDate.getFullYear()}`;

            const firstDay = new Date(calendarDate.getFullYear(), calendarDate.getMonth(), 1).getDay();
            const daysInMonth = new Date(calendarDate.getFullYear(), calendarDate.getMonth() + 1, 0).getDate();

            // Empty slots
            for (let i = 0; i < firstDay; i++) {
                container.innerHTML += '<div></div>';
            }

            for (let d = 1; d <= daysInMonth; d++) {
                const isSelected = selectedDate.getDate() === d && selectedDate.getMonth() === calendarDate.getMonth() && selectedDate.getFullYear() === calendarDate.getFullYear();
                const hasSales = checkSalesOnDate(new Date(calendarDate.getFullYear(), calendarDate.getMonth(), d));

                const btn = document.createElement('div');
                btn.innerText = d;
                btn.style.cssText = `
                    padding: 8px; font-size: 11px; cursor: pointer; border-radius: 5px; font-weight: 700;
                    background: ${isSelected ? '#3b82f6' : (hasSales ? 'rgba(59, 130, 246, 0.15)' : 'none')};
                    color: ${isSelected ? 'white' : (hasSales ? '#2563eb' : '#0284c7')};
                    border: ${isSelected ? 'none' : '1px solid rgba(2,132,199,0.1)'};
                `;
                btn.onclick = () => {
                    selectedDate = new Date(calendarDate.getFullYear(), calendarDate.getMonth(), d);
                    selectedDate.setHours(0, 0, 0, 0);
                    initCalendar();
                    if (currentView === 'daily') runDailyReport();
                };
                container.appendChild(btn);
            }
        }

        function checkSalesOnDate(date) {
            const ds = date.toDateString();
            return history.some(h => new Date(h.timestamp).toDateString() === ds);
        }

        function changeMonth(dir) {
            calendarDate.setMonth(calendarDate.getMonth() + dir);
            initCalendar();
        }

        // --- REPORTING LOGIC ---
        function runDailyReport() {
            document.getElementById('reportLabel').innerText = "VISTA DIARIA";
            document.getElementById('reportValue').innerText = selectedDate.toLocaleDateString('es-ES', { day: 'numeric', month: 'long' }).toUpperCase();

            const area = document.getElementById('reportArea');
            const targetDateStr = selectedDate.toDateString();
            const isToday = targetDateStr === new Date().toDateString();
            const dailySales = history.filter(h => new Date(h.timestamp).toDateString() === targetDateStr);

            const total = dailySales.reduce((sum, s) => sum + s.total, 0);
            document.getElementById('totalRevenue').innerText = `S/ ${total.toFixed(2)}`;

            let html = ``;

            if (dailySales.length > 0) {
                // Group by hour
                const hourly = {};
                dailySales.forEach(sale => {
                    const hour = new Date(sale.timestamp).getHours();
                    if (!hourly[hour]) hourly[hour] = { total: 0, items: {} };
                    hourly[hour].total += sale.total;
                    sale.items.forEach(item => {
                        hourly[hour].items[item.name] = (hourly[hour].items[item.name] || 0) + 1;
                    });
                });

                html += `<h2 style="color: var(--gold); margin-top: 0; font-size: 18px;">📊 DETALLE DE VENTAS (COBRADAS)</h2>`;

                // Sort hours descending
                const sortedHours = Object.keys(hourly).sort((a, b) => b - a);

                sortedHours.forEach(h => {
                    const hourStr = `${h.padStart(2, '0')}:00 - ${(parseInt(h) + 1).toString().padStart(2, '0')}:00`;
                    html += `
                        <div style="background: rgba(255,255,255,0.03); border-radius: 15px; border: 1px solid var(--card-border); margin-bottom: 15px; overflow: hidden;">
                            <div style="background: rgba(212, 175, 55, 0.1); padding: 12px 20px; display: flex; justify-content: space-between; align-items:center;">
                                <span style="font-weight: 800; color: var(--gold); font-size: 13px;">🕒 ${hourStr}</span>
                                <span style="font-weight: 900; color: white;">S/ ${hourly[h].total.toFixed(2)}</span>
                            </div>
                            <div style="padding: 15px 20px;">
                                ${Object.entries(hourly[h].items).map(([name, count]) => `
                                    <div style="display: flex; justify-content: space-between; font-size: 13px; padding: 5px 0; border-bottom: 1px solid rgba(255,255,255,0.03);">
                                        <span style="color: var(--text-muted); font-weight: 600;">${name.toUpperCase()}</span>
                                        <span style="color: white; font-weight: 800;">x${count}</span>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    `;
                });
            }

            if (isToday) {
                const db = window.getDB();
                const activeTables = [];
                if (db) {
                    for (let i = 1; i <= 28; i++) {
                        const mesa = db[`mesa_${i}`];
                        if (mesa && mesa.status === 'occupied' && mesa.items && mesa.items.length > 0) {
                            activeTables.push(mesa);
                        }
                    }
                }

                if (activeTables.length > 0) {
                    html += `<h2 style="color: #4ade80; margin-top: 30px; font-size: 18px;">🔥 CONSUMO EN CURSO (MESAS ACTIVAS)</h2>`;
                    let activeTotal = 0;
                    activeTables.forEach(mesa => {
                        let mesaTotalCalculated = 0;
                        const itemCounts = {};
                        mesa.items.forEach(item => {
                            itemCounts[item.name] = (itemCounts[item.name] || 0) + 1;
                            mesaTotalCalculated += item.price;
                        });
                        const displayTotal = mesa.total > 0 ? mesa.total : mesaTotalCalculated;

                        html += `
                        <div style="background: rgba(16, 185, 129, 0.05); border-radius: 15px; border: 1px solid rgba(16, 185, 129, 0.3); margin-bottom: 15px; overflow: hidden;">
                            <div style="background: rgba(16, 185, 129, 0.15); padding: 12px 20px; display: flex; justify-content: space-between; align-items:center;">
                                <span style="font-weight: 800; color: #4ade80; font-size: 13px;">MESA ${mesa.id}</span>
                                <span style="font-weight: 900; color: white;">S/ ${displayTotal.toFixed(2)}</span>
                            </div>
                            <div style="padding: 15px 20px;">
                        `;
                        Object.entries(itemCounts).forEach(([name, count]) => {
                            html += `
                                <div style="display: flex; justify-content: space-between; font-size: 13px; padding: 5px 0; border-bottom: 1px solid rgba(255,255,255,0.03);">
                                    <span style="color: var(--text-muted); font-weight: 600;">${name.toUpperCase()}</span>
                                    <span style="color: white; font-weight: 800;">x${count}</span>
                                </div>
                            `;
                        });
                        html += `</div></div>`;
                        activeTotal += displayTotal;
                    });
                    html += `
                        <div style="text-align: right; padding: 15px 0; color: #4ade80; font-weight: 900; font-size: 18px;">
                            TOTAL EN SALA: S/ ${activeTotal.toFixed(2)}
                        </div>
                    `;
                } else if (dailySales.length === 0) {
                    html = `<div style="text-align:center; padding: 100px; opacity: 0.5;"><h3>SIN VENTAS NI MESAS ACTIVAS</h3><p>No hay consumo en curso ni cerrado para hoy</p></div>`;
                }
            } else if (dailySales.length === 0) {
                html = `<div style="text-align:center; padding: 100px; opacity: 0.5;"><h3>SIN VENTAS</h3><p>No hay registros cerrados para este día</p></div>`;
            }

            area.innerHTML = html;
        }

        function runWeeklyReport() {
            const weekInput = document.getElementById('weekInput').value;
            if (!weekInput) {
                document.getElementById('reportArea').innerHTML = `
                    <div style="text-align:center; padding: 100px; opacity: 0.5;">
                        <h3>VISTA SEMANAL</h3>
                        <p>Por favor seleccione una semana arriba para ver el resumen</p>
                    </div>`;
                return;
            }

            document.getElementById('reportLabel').innerText = "RESUMEN SEMANAL";
            document.getElementById('reportValue').innerText = weekInput;

            // Simple parser for YYYY-Wnn
            const [year, week] = weekInput.split('-W').map(Number);

            // Get sales for that week
            const filtered = history.filter(h => {
                const d = new Date(h.timestamp);
                const firstDayOfYear = new Date(d.getFullYear(), 0, 1);
                const pastDaysOfYear = (d - firstDayOfYear) / 86400000;
                const dWeek = Math.ceil((pastDaysOfYear + firstDayOfYear.getDay() + 1) / 7);
                return d.getFullYear() === year && dWeek === week;
            });

            const total = filtered.reduce((sum, s) => sum + s.total, 0);
            document.getElementById('totalRevenue').innerText = `S/ ${total.toFixed(2)}`;

            // Summary by day
            const dailyTotals = { "Lun": 0, "Mar": 0, "Mié": 0, "Jue": 0, "Vie": 0, "Sáb": 0, "Dom": 0 };
            const dayNames = ["Dom", "Lun", "Mar", "Mié", "Jue", "Vie", "Sáb"];

            filtered.forEach(sale => {
                const day = dayNames[new Date(sale.timestamp).getDay()];
                dailyTotals[day] += sale.total;
            });

            let html = `<h2 style="color: var(--gold); margin-top: 0; font-size: 18px;">📈 RESUMEN DE LA SEMANA</h2>`;
            html += `<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; margin-top: 20px;">`;

            ["Lun", "Mar", "Mié", "Jue", "Vie", "Sáb", "Dom"].forEach(day => {
                const val = dailyTotals[day];
                html += `
                    <div style="background: rgba(255,255,255,0.05); padding: 20px; border-radius: 18px; border: 1px solid var(--card-border); text-align: center;">
                        <div style="color: var(--text-muted); font-size: 10px; font-weight: 800; margin-bottom: 10px;">${day.toUpperCase()}</div>
                        <div style="font-size: 18px; font-weight: 900; color: ${val > 0 ? 'var(--gold)' : 'rgba(255,255,255,0.2)'}">
                            S/ ${val.toFixed(2)}
                        </div>
                    </div>
                `;
            });
            html += `</div>`;

            // Show top products of the week
            const products = {};
            filtered.forEach(s => s.items.forEach(i => products[i.name] = (products[i.name] || 0) + 1));
            const top = Object.entries(products).sort((a, b) => b[1] - a[1]).slice(0, 5);

            if (top.length > 0) {
                html += `
                    <div style="margin-top: 40px;">
                        <h3 style="color: white; font-size: 14px; border-left: 4px solid var(--gold); padding-left: 10px;">MÁS VENDIDOS DE LA SEMANA</h3>
                        <div style="margin-top: 15px;">
                            ${top.map(([name, count]) => `
                                <div style="display:flex; justify-content:space-between; padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.05);">
                                    <span style="font-weight: 600; color: var(--text-muted);">${name.toUpperCase()}</span>
                                    <span style="font-weight: 800; color: var(--gold);">${count} uds.</span>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            }

            document.getElementById('reportArea').innerHTML = html;
        }
    </script>
</body>

</html>
