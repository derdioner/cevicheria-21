<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CEVICHERIA 21 - Caja</title>
    <link rel="stylesheet" href="style.css?v=27.6">
    <link rel="icon" href="logo.png">
    <link rel="icon" href="logo.png">
</head>

<body class="glass">
    <header>
        <div style="display: flex; align-items: center; gap: 15px;">
            <img src="logo.png" style="height: 50px; border-radius: 12px; border: 1px solid var(--gold);">
            <div>
                <h1>💻 <span>CAJA / CONTROL</span></h1>
                <p style="margin: 0; color: var(--text-muted); font-size: 12px; letter-spacing: 1px;">
                    SISTEMA DE GESTIÓN • <span id="db-status" style="color: var(--gold);">⏳
                        SINCRONIZANDO...</span>
                </p>
            </div>
        </div>

        <div class="dashboard-stats">
            <div class="stat-card">
                <span style="font-size: 10px; color: var(--text-muted); text-transform: uppercase;">Mesas Activas</span>
                <div class="value" id="statOccupied">- / 20</div>
            </div>
            <div class="stat-card">
                <span style="font-size: 10px; color: var(--text-muted); text-transform: uppercase;">Ventas Hoy</span>
                <div class="value" id="statSales">S/ 0.00</div>
            </div>
        </div>

        <a href="index.html" class="btn-exit"
            style="background: rgba(239, 68, 68, 0.1); color: var(--accent); padding: 10px 20px; border-radius: 12px; text-decoration: none; font-weight: 800; border: 1px solid rgba(239, 68, 68, 0.2); font-size: 12px;">
            CERRAR SESIÓN
        </a>
    </header>

    <div class="cashier-dashboard">
        <!-- LEFT: Tables 1-10 -->
        <div class="tables-column glass" style="padding: 10px;">
            <h3
                style="margin-top:0; color: var(--gold); font-size: 11px; letter-spacing: 1px; text-transform: uppercase; text-align: center;">
                BLOQUE 1-10</h3>
            <div class="grid-mesas" id="tablesLeft"
                style="grid-template-columns: 1fr 1fr !important; gap: 6px; padding: 5px;"></div>
        </div>

        <!-- CENTER: Action Panel -->
        <div class="action-panel glass" id="actionPanel">
            <div style="text-align:center; color: var(--text-muted); margin-top: 100px;">
                <div style="font-size: 60px; margin-bottom: 20px; opacity: 0.3;">🍽️ </div>
                <p style="font-weight: 600; font-size: 18px;">PANEL DE CONTROL</p>
                <p style="font-size: 13px; opacity: 0.7;">Seleccione una mesa para gestionar<br>pedidos y cobranza</p>
            </div>
        </div>

        <!-- RIGHT: Tables 11-20 -->
        <div class="tables-column glass" style="padding: 10px;">
            <h3
                style="margin-top:0; color: var(--gold); font-size: 11px; letter-spacing: 1px; text-transform: uppercase; text-align: center;">
                BLOQUE 11-20</h3>
            <div class="grid-mesas" id="tablesRight"
                style="grid-template-columns: 1fr 1fr !important; gap: 6px; padding: 5px;"></div>
        </div>
    </div>


    <!-- Preload the Yape image so it's ready for print -->

    <script type="module">
        import { db as firestoreDb } from './firebase-config.js';
        import './script.js?v=v12';

        let currentMesaId = null;
        let allMesas = {};

        // Integration with script.js motor
        window.onload = () => {
            setTimeout(() => {
                if (typeof window.initDB === 'function') {
                    window.initDB();
                    console.log("Caja: initDB called");
                }
                syncFromScript();
            }, 500);
        };

        function syncFromScript() {
            if (typeof window.getDB === 'function') {
                allMesas = window.getDB();
                renderDashboard();
                updateStats();
                if (currentMesaId) showMesaDetails(currentMesaId);

                const statusEl = document.getElementById('db-status');
                statusEl.style.color = 'var(--accent)';
                statusEl.innerText = '✅ ONLINE (FIRESTORE)';
            }
        }

        // Exposed for script.js to call on every remote update
        window.renderTables = () => {
            syncFromScript();
        };

        function updateStats() {
            let occupied = 0;
            let totalSales = 0;
            Object.values(allMesas).forEach(m => {
                if (m.status === 'occupied') occupied++;
                if (m.status === 'paid' && m.lastUpdate && new Date(m.lastUpdate).toDateString() === new Date().toDateString()) {
                }
            });
            document.getElementById('statOccupied').innerText = `${occupied} / 28`;
        }

        function renderDashboard() {
            const left = document.getElementById('tablesLeft');
            const right = document.getElementById('tablesRight');
            left.innerHTML = '';
            right.innerHTML = '';

            for (let i = 1; i <= 28; i++) {
                const mesa = allMesas[i] || { status: 'free' };
                const div = document.createElement('div');
                div.className = `mesa-card ${mesa.status}`;
                div.innerHTML = `
                    <div style="font-size: 10px; opacity: 0.6;">MESA</div>
                    <div style="font-size: 18px; font-weight: 900;">${i}</div>
                    <div style="font-size: 10px; margin-top:5px; color: ${mesa.status === 'occupied' ? '#EF4444' : 'inherit'}">
                        ${mesa.status === 'occupied' ? 'S/ ' + (mesa.total || 0).toFixed(2) : 'LIBRE'}
                    </div>
                `;
                div.onclick = () => showMesaDetails(i);
                if (i <= 14) left.appendChild(div);
                else right.appendChild(div);
            }
        }

        function showMesaDetails(id) {
            currentMesaId = id;
            const mesa = allMesas[id] || { status: 'free', items: [], total: 0 };
            const panel = document.getElementById('actionPanel');

            if (mesa.status === 'free') {
                panel.innerHTML = `
                    <div style="text-align:center; padding: 50px;">
                        <h2 style="color: var(--gold);">MESA ${id}</h2>
                        <p style="color: var(--text-muted);">Esta mesa está disponible actualmente.</p>
                        <button class="btn-primary" onclick="alert('Usa el panel de mesero para abrir mesas')">ABRIR MESA</button>
                    </div>
                `;
                return;
            }

            panel.innerHTML = `
                <div class="mesa-detail-view">
                    <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 20px;">
                        <div>
                            <h2 style="margin:0; color: var(--gold);">MESA ${id}</h2>
                        </div>
                        <div style="text-align: right;">
                            <div style="font-size: 24px; font-weight: 900; color: var(--accent);">S/ ${(mesa.total || 0).toFixed(2)}</div>
                            <span class="badge">OCUPADA</span>
                        </div>
                    </div>

                    <div style="max-height: 400px; overflow-y: auto; background: rgba(255,255,255,0.03); border-radius: 12px; padding: 15px;">
                        ${mesa.items.map((item, idx) => `
                            <div style="display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.05);">
                                <div style="display: flex; align-items: center; gap: 8px;">
                                    ${(!item.printed && item.category !== 'BEBIDAS') ? `<span style="background: var(--accent); color: white; font-size: 8px; font-weight: 900; padding: 2px 4px; border-radius: 4px; animation: pulse 1s infinite;">NUEVO</span>` : ''}
                                    <div>
                                        <div style="font-weight: 600; font-size: 14px; color: var(--blue-light);">${item.name}</div>
                                        ${item.comment ? `<div style="font-size: 11px; color: var(--gold);">📝 ${item.comment}</div>` : ''}
                                    </div>
                                </div>
                                <div style="font-weight: 700; color: var(--gold);">S/ ${item.price.toFixed(2)}</div>
                            </div>
                        `).join('')}
                    </div>

                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px;">
                        <button class="btn-secondary" id="btnTicket" style="font-size: 11px;">🖨️ CUENTA</button>
                        <button class="btn-primary" id="btnCocina" style="font-size: 11px; background: #D32F2F; border-color: #B71C1C;">🍳 COCINA</button>
                    </div>
                    <button class="btn-primary" id="btnPagar" style="width: 100%; margin-top: 10px; height: 50px; font-weight: 900;">💰 REGISTRAR PAGO</button>
                </div>
            `;

            document.getElementById('btnTicket').onclick = () => printBill(id);
            document.getElementById('btnCocina').onclick = () => printComanda();
            document.getElementById('btnPagar').onclick = () => processPayment(id);
        }

        async function processPayment(id) {
            const mesaKey = `mesa_${id}`;
            const mesaDetail = allMesas[mesaKey];
            if (!mesaDetail || mesaDetail.total === 0) return;

            if (!confirm(`¿Confirmar pago de S/ ${mesaDetail.total.toFixed(2)} para la Mesa ${id}?`)) return;

            try {
                // Add to history
                if (typeof window.addToHistory === 'function') {
                    window.addToHistory(mesaDetail);
                }

                // Reset table
                mesaDetail.status = 'free';
                mesaDetail.items = [];
                mesaDetail.total = 0;
                mesaDetail.lastUpdate = new Date().toISOString();

                // Save to Firestore
                if (typeof window.saveDB === 'function') {
                    await window.saveDB(allMesas);
                }

                alert('Pago procesado correctamente');
                currentMesaId = null;
                renderDashboard();
                updateStats();
                document.getElementById('actionPanel').innerHTML = `
                    <div style="text-align:center; color: var(--text-muted); margin-top: 100px;">
                        <div style="font-size: 60px; margin-bottom: 20px; opacity: 0.3;">🍽️ </div>
                        <p style="font-weight: 600; font-size: 18px;">PAGO COMPLETADO</p>
                        <p style="font-size: 13px; opacity: 0.7;">Mesa liberada con éxito</p>
                    </div>`;
            } catch (error) {
                console.error("Error al procesar pago:", error);
                alert('Error al procesar pago');
            }
        }

        function printBill(id) {
            const mesa = allMesas[id];
            const iframe = document.createElement('iframe');
            iframe.style.display = 'none';
            document.body.appendChild(iframe);
            const doc = iframe.contentWindow.document;

            doc.write(`
                <html>
                <head>
                    <base href="${window.location.href}">
                    <style>
                        body { font-family: 'Courier New', monospace; width: 58mm; padding: 5px; font-size: 12px; text-align: center; }
                        .header { font-weight: bold; font-size: 1.4em; border-bottom: 2px dashed #000; margin-bottom: 10px; }
                        .item { display: flex; justify-content: space-between; margin: 3px 0; }
                        .total { font-weight: bold; font-size: 1.2em; border-top: 1px solid #000; padding: 5px 0; }
                        .qr-container { margin-top: 15px; border-top: 1px dashed #ccc; padding-top: 10px; }
                        .qr-img { width: 120px; height: 120px; margin-top: 5px; }
                        hr { border: 0; border-top: 1px dashed #000; }
                    </style>
                </head>
                <body>
                    <div class="header">CEVICHERÍA 21</div>
                    <div>Experiencia Premium</div>
                    <hr>
                    <div style="font-weight: bold;">MESA: ${id}</div>
                    <div>${new Date().toLocaleString()}</div>
                    <hr>
                    <div style="text-align: left; margin: 10px 0;">
                        ${mesa.items.map(i => `
                            <div class="item">
                                <span>${i.name}</span>
                                <span>${i.price.toFixed(2)}</span>
                            </div>
                            ${i.comment ? `<div style="font-size: 10px; color: #555;">- ${i.comment}</div>` : ''}
                        `).join('')}
                    </div>
                    <hr>
                    <div class="total">TOTAL: S/ ${mesa.total.toFixed(2)}</div>
                    <script>
                        window.onload = () => { window.print(); window.close(); };
                    <\/script>
</body>

</html>
`);
            doc.close();
        }

        function formatMoney(n) {
            return `S/ ${(n || 0).toFixed(2)}`;
        }
    </script>

    <style>
        .mesa-detail-view {
            padding: 20px;
            animation: fadeIn 0.3s ease;
        }

        .badge {
            background: var(--accent);
            color: white;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 10px;
            font-weight: 800;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</body>

</html>
