<!DOCTYPE html>
<html>
<head><title>Reset DB</title></head>
<body>
    <h1>WIPING DATABASE...</h1>
    <h2 id="status">Please wait...</h2>
    <script type="module">
        import { doc, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { db } from "./firebase-config.js";

        // IMPORTANT: Because Firestore rules might not allow wiping from web naturally if security rules exist
        // But assuming they are open:
        const DB_COLLECTION = "cevicheria_21_data";
        const DB_DOC_ID = "tables";

        async function reset() {
            try {
                const initialData = {};
                for (let i = 1; i <= 28; i++) {
                    initialData[`mesa_${i}`] = {
                        id: i,
                        status: 'free',
                        items: [],
                        total: 0
                    };
                }
                initialData.dailySales = [];
                
                const docRef = doc(db, DB_COLLECTION, DB_DOC_ID);
                await setDoc(docRef, initialData);
                document.getElementById('status').innerText = "SUCCESS! DB WIPED.";
                // Clear all local storage as well for complete cache clear
                localStorage.clear();
                
            } catch (e) {
                console.error(e);
                document.getElementById('status').innerText = "ERROR: " + e.message;
            }
        }
        reset();
    </script>
</body>
</html>
